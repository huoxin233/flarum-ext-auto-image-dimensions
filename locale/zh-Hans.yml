huoxin-auto-image-dimensions:
  admin:
    operating_mode_label: 运行模式
    operating_mode_help: 选择获取图片尺寸的方式。推荐使用混合模式。
    operating_mode_backend: 仅后端队列 (服务器获取图片)
    operating_mode_client: 仅纯客户端 (浏览器获取图片)
    operating_mode_hybrid: 混合模式 (后端优先，客户端作为备用)
    schedule_interval_label: 定时任务间隔
    schedule_interval_help: 后端应多长时间自动将旧帖子加入队列以提取图片尺寸？需要设置 Flarum cron 计划任务。
    schedule_interval_disabled: 禁用 (仅手动)
    schedule_interval_daily: 每天
    schedule_interval_weekly: 每周
    schedule_interval_monthly: 每月
    retry_mode_label: 定时任务目标模式
    retry_mode_help: 自动定时任务应该处理所有缺失尺寸的图片，还是仅处理之前失败的图片？
    retry_mode_all: 所有缺失尺寸的图片
    retry_mode_failed_only: 仅处理失败的图片
    manual_trigger_label: 手动触发队列
    manual_trigger_help: 立即加入后台任务队列，为帖子提取图片尺寸。
    trigger_all_button: 队列所有缺失图片
    trigger_failed_button: 队列仅失败图片
    trigger_confirm_text: 您确定要将这些任务加入队列吗？这将在后台运行。
    trigger_success: 成功将 {count} 个任务加入队列！
    proxy_label: HTTP 代理 (SSRF 防护)
    proxy_help: "通过内部代理路由后端的图片尺寸请求，以隐藏您服务器的真实 IP (例如 tcp://10.0.0.5:3128)。强烈建议使用代理以防止高级 SSRF（DNS 重绑定）攻击！留空则仅使用基础的 PHP IP 过滤防护。"
    max_height_label: 最大图片高度
    max_height_help: "为图片设置一个数学高度限制（例如 400）。扩展将按比例缩小宽度以保持纵横比，而不会破坏布局限制。设置为 0 以禁用。"
    permissions:
      refresh_label: 允许刷新帖子图片尺寸
      report_label: 允许上报客户端图片尺寸
  forum:
    post_controls:
      refresh_button: 刷新图片尺寸
    alerts:
      refresh_success: 图片尺寸已清除！稍后将重新计算。
