huoxin-auto-image-dimensions:
  admin:
    operating_mode_label: Operating Mode
    operating_mode_help: Choose how image dimensions are fetched. Hybrid is recommended.
    operating_mode_backend: Backend Queue Only (Server fetches images)
    operating_mode_client: Pure Client-Side Only (Browser fetches images)
    operating_mode_hybrid: True Hybrid (Backend primary, Client-Side fallback)
    schedule_interval_label: Schedule Interval
    schedule_interval_help: How often should the backend automatically queue older posts for image dimension extraction? Requires Flarum cron setup.
    schedule_interval_disabled: Disabled (Manual Only)
    schedule_interval_daily: Daily
    schedule_interval_weekly: Weekly
    schedule_interval_monthly: Monthly
    retry_mode_label: Scheduled Target Mode
    retry_mode_help: Should the automated schedule process ALL images lacking dimensions, or ONLY images that previously failed?
    retry_mode_all: All Images Lacking Dimensions
    retry_mode_failed_only: Only Failed Images
    manual_trigger_label: Manual Backfill Trigger
    manual_trigger_help: Instantly queue background jobs to fetch dimensions for posts.
    trigger_all_button: Queue All Missing
    trigger_failed_button: Queue Failed Only
    trigger_confirm_text: Are you sure you want to queue these jobs? This will run in the background.
    trigger_success: Successfully queued {count} jobs!
    proxy_label: HTTP Proxy (SSRF Protection)
    proxy_help: "Route backend image dimension requests through an internal proxy to mask your server's true IP (e.g. tcp://10.0.0.5:3128). Leave blank to disable."
    permissions:
      refresh_label: Refresh Post Image Dimensions
  forum:
    post_controls:
      refresh_button: Refresh Image Dimensions
    alerts:
      refresh_success: Image dimensions cleared! They will be recalculated shortly.
